# =============================================================================
#  魔幻赛马 / Horse Racing — nginx 站点配置
#
#  由 Dockerfile 覆盖到 /etc/nginx/conf.d/default.conf。
#  构建阶段会用 `nginx -t` 解析这份配置，语法错误会在构建时暴露，
#  而不是等到运维在服务器上 docker run 才炸。
#
#  三条刻意为之的约束：
#
#  1. listen 固定 8080，与 rootless 基础镜像（nginxinc/nginx-unprivileged）
#     的约定一致。对外端口请用发布映射改：HR_WEB_PORT=8081 docker compose up -d
#
#  2. 所有缓存策略只用 expires，绝不用 add_header。
#     nginx 的 add_header 不会从 server 继承到「自己声明了 add_header 的
#     location」——混用会让那个 location 悄悄丢掉全部安全响应头。用 expires
#     表达缓存就不影响继承，安全头只在此处声明一次。
#
#  3. 整份配置不写磁盘：日志走 stdout/stderr，状态在 /tmp。
#     因此容器可以配 read_only: true 跑。
# =============================================================================

server {
    # 只监听 IPv4。官方非特权镜像的 entrypoint 会在容器**支持** IPv6 时再补
    # listen [::]:8080；这里写死会让 IPv6 已关闭的宿主机直接启动失败。
    # 容器本身是通过端口映射（IPv4）暴露的，IPv4-only 足够。
    listen      8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/css text/plain text/javascript application/javascript image/svg+xml;

    server_tokens     off;   # 不回显 nginx 版本号
    absolute_redirect off;   # 重定向保持相对，换域名/端口都不用改配置

    # 日志直接进容器日志，运维用 docker logs / compose logs 即可
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 这是个纯静态游戏，除了 GET/HEAD 不该有任何方法
    client_max_body_size 1k;
    client_body_timeout  10s;
    send_timeout         30s;
    keepalive_timeout    65s;

    # ------------------------------------------------------------- 压缩 -----
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied    any;
    # webp / ico / woff2 本身已是压缩格式，列进来只会白烧 CPU、省不下字节
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml application/manifest+json;

    # --------------------------------------------------------- 安全响应头 ---
    add_header X-Content-Type-Options     "nosniff"     always;
    add_header X-Frame-Options            "SAMEORIGIN"  always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # 整套资源已完全自包含：无 CDN、无 fetch/XHR/WebSocket，
    # 用户文本只经 textContent 进 DOM —— 所以策略可以收得很紧。
    # style-src 保留 'unsafe-inline' 是刻意的：像素界面全部靠内联样式定位，
    # 而这里并不存在 HTML 注入点（innerHTML 仅用于清空容器）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    # --------------------------------------------------------------- 探活 ---
    # 供 HEALTHCHECK / k8s / 负载均衡使用；不写访问日志、不允许缓存
    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    # ------------------------------------------------- 永久不可变的像素素材 --
    # 314 个无损 WebP 与字体子集在同名路径下永不变化，可以放心长缓存。
    # 换了素材就换镜像，浏览器缓存键随发布自然失效。
    location ^~ /assets/ {
        access_log off;
        expires 1y;                 # Cache-Control: max-age=31536000
        limit_except GET HEAD { deny all; }
        try_files $uri =404;        # 缺失的素材必须报 404，绝不能被回退掩盖
    }

    # --------------------------------------------- 入口文件：每次都要校验 ---
    # HTML/JS/CSS 决定了「游戏是什么」，必须每次重新校验；
    # nginx 默认带 ETag，所以实际代价是一个 304。
    location ~* \.(?:html|js|mjs|css|json)$ {
        expires -1;                 # Cache-Control: no-cache
        try_files $uri =404;
    }

    location / {
        expires -1;
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    # 像素风 404 页（internal：只能被 error_page 内部跳转使用，不可直接访问）
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
