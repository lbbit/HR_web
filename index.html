<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="魔幻赛马（Horse Racing）现代 Web 复刻版 —— 原生 ES Module + Web Audio，原样复用原作手绘像素素材复刻全部 13 个界面与玩法。" />
  <meta name="theme-color" content="#0a3a5c" />
  <title>魔幻赛马 · Horse Racing (Pixel Web Remake)</title>
  <link rel="icon" href="./assets/ui/favicon.ico" />
  <link rel="preload" as="font" type="font/woff2" href="./assets/fonts/zpix-subset.woff2" crossorigin="anonymous" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- fixed-resolution pixel stage; JS sets width/height per screen and scales it -->
    <div id="stage" role="application" aria-label="魔幻赛马游戏窗口">
      <!-- modal dialog (pause / quit) rendered on top of the current screen -->
      <div id="modal" role="dialog" aria-modal="true" aria-label="对话框">
        <div class="box"></div>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="loader" role="status" aria-live="polite">
    <div class="logo">🐎</div>
    <div class="title">魔幻赛马</div>
    <div class="bar"><i id="loader-fill"></i></div>
    <div class="hint" id="loader-text">正在加载像素资源…</div>
  </div>

  <noscript>
    <p style="color:#fff;font-family:monospace;padding:20px">本游戏需要启用 JavaScript。</p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
